<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Akvariumo Suderinamumas</title>
    <style>
        /* Žuvies kortelės dizainas */
        .fish-card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 16px;
            width: 250px;
            position: relative;
            font-family: sans-serif;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
        }

        /* Statinis indikatoriaus burbuliukas */
        .indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            position: absolute;
            top: 16px;
            right: 16px;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .indicator:hover {
            transform: scale(1.2); /* Šiek tiek padidėja užvedus pelę */
        }

        /* Spalvų klasės */
        .bg-green { background-color: #4CAF50; }
        .bg-yellow { background-color: #FFC107; }
        .bg-red { background-color: #F44336; }

        /* Klaidų sąrašo stilius */
        .error-container {
            display: none; /* Paslėpta pagal nutylėjimą */
            margin-top: 15px;
            padding: 10px;
            background-color: #f9f9f9;
            border-left: 3px solid #333;
            font-size: 12px;
            font-family: monospace; /* Techninis šriftas kodams */
        }

        .error-container ul {
            margin: 0;
            padding-left: 20px;
            color: #d32f2f;
        }
    </style>
</head>
<body>

    <div class="fish-card" id="cichlid-card">
        <h3>Cichlidas plėšrūnas</h3>
        <p>Reikalingas tūris: 100L</p>
        <p>Temp: 24-28°C</p>
        
        <div id="compatibility-indicator" class="indicator" title="Paspauskite, kad pamatytumėte detales"></div>
        
        <div id="error-details" class="error-container">
            <strong>Suderinamumo kodai:</strong>
            <ul id="error-list"></ul>
        </div>
    </div>

    <script>
        // 1. Simuliuojame žaibišką atsakymą iš jūsų Python Backendo (< 0.5 sek.)
        // Realybėje čia būtų fetch() užklausa į API.
        const backendResponse = {
            color: "Raudona (Nesuderinama)",
            codes: [
                "VOLUME_LIMIT_EXCEEDED", 
                "PREDATOR_ALERT", 
                "PH_MISMATCH_CRITICAL"
            ]
        };

        // 2. Surandame HTML elementus
        const indicatorEl = document.getElementById('compatibility-indicator');
        const errorDetailsContainer = document.getElementById('error-details');
        const errorListEl = document.getElementById('error-list');

        // 3. Optimizuota funkcija indikatoriaus atvaizdavimui (įvyksta iškart)
        function renderIndicator(data) {
            // Priskiriame atitinkamą spalvos klasę
            if (data.color.includes("Žalia")) {
                indicatorEl.classList.add('bg-green');
            } else if (data.color.includes("Geltona")) {
                indicatorEl.classList.add('bg-yellow');
            } else if (data.color.includes("Raudona")) {
                indicatorEl.classList.add('bg-red');
            }

            // Užpildome klaidų sąrašą (visos klaidos vienu metu)
            data.codes.forEach(code => {
                const li = document.createElement('li');
                li.textContent = code;
                errorListEl.appendChild(li);
            });
        }

        // 4. Interaktyvus paspaudimo (click) įvykis
        indicatorEl.addEventListener('click', () => {
            // Perjungia (parodo/paslepia) klaidų bloko matomumą
            if (errorDetailsContainer.style.display === 'block') {
                errorDetailsContainer.style.display = 'none';
            } else {
                errorDetailsContainer.style.display = 'block';
            }
        });

        // Paleidžiame atvaizdavimą iškart po kortelės "užkrovimo"
        renderIndicator(backendResponse);
    </script>

</body>
</html>
